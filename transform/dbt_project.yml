name: job_market_intel
version: "1.0.0"
config-version: 2

profile: job_market_intel

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  job_market_intel:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      # Marts are tables: Power BI reads these directly and should never pay
      # to re-run the whole DAG on refresh.
      +materialized: table
      +schema: marts
