name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # CI never touches the job board APIs. It rebuilds from the parquet store
      # that is already in the repo, so a model change is tested against real
      # committed data — deterministic, offline, and identical on every run.
      - name: Rebuild warehouse from store
        run: uv run python -m ingest.load

      - name: Build and test models
        working-directory: transform
        run: uv run dbt build --profiles-dir .
