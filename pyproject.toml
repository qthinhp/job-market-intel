[project]
name = "job-market-intel"
version = "0.1.0"
description = "US tech job market pipeline: ATS ingest -> DuckDB -> dbt -> analysis"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyyaml>=6.0",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
